line-length = 100
target-version = "py311"
# `extend-exclude`, not `exclude`: the latter *replaces* ruff's built-in
# defaults, which is how `.venv`, `build/` and `node_modules/` came to be
# skipped only incidentally by `respect-gitignore`. With that flag off,
# `ruff check .` reported 37,222 findings from site-packages.
extend-exclude = [
  "presto_old_code_starts",
  ".pytest_cache",
  "__pycache__",
  # Frozen snapshots of scripts as they ran. Editing them to satisfy a linter
  # would falsify the experiment record.
  #
  # This lived in `[lint.per-file-ignores]` and I deleted it as dead config,
  # reasoning that `lint.sh` never passed the path. That was wrong: lint.sh is
  # one caller among many. Editor and LSP integrations, pre-commit hooks and a
  # bare `ruff check .` all read this file, and after the deletion `ruff check
  # .` reported 546 findings here while `ruff format .` offered to rewrite the
  # snapshots. Exclusion belongs in the config, where every caller sees it.
  "experiments",
]

[format]
# Preserve the existing quote style: the goal was to get lines under the limit,
# not to restyle a codebase that has never been formatter-managed.
quote-style = "preserve"

[lint]
# Widened from ["E9", "F63", "F7", "F82"] to the full E/F sets.
#
# A `[tool.ruff]` block in pyproject.toml declared `select = ["E", "F"]` and
# never ran, because ruff.toml takes precedence -- so "lint clean" meant far
# less than it read as. This is that intent, applied to the config that
# actually executes.
#
# Note what is NOT carried over: the dead block also listed `F821` under
# `ignore`, while `F82` was already active here. Adopting it wholesale would
# have *weakened* undefined-name checking. Undefined names stay on.
select = [
  "E",
  "F",
  "B011",   # assert False -- unreachable under python -O
  "B015",   # pointless comparison, almost always a dropped assert
  "B018",   # useless expression, ditto
  "PT015",  # assertion that is always false
  "PT017",  # asserting on an exception in `except` instead of pytest.raises
]

[lint.per-file-ignores]
# Re-exports are the entire point of a package __init__; ruff has no way to
# tell one from an unused import.
"__init__.py" = ["F401"]
