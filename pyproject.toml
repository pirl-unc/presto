[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "presto"
dynamic = ["version"]
description = "Presto — Unified immunoinformatics for presentation, recognition, and immunogenicity."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "torch>=2.1.0",
  "numpy>=1.24.0",
  "pyyaml>=6.0",
  "mhcgnomes",
  "mhcseqs",
  "tqdm>=4.66.0",
  # Used by the probe/plot paths in scripts/ and data/cross_source_dedup.py.
  # Previously undeclared, which is why the plot tests failed in a clean
  # environment while passing locally.
  "matplotlib>=3.7",
]

[project.optional-dependencies]
hitlist = [
  # >=1.46.0: before that, `apm_genes_perturbed` was ORed across a study, so
  # unperturbed controls carried their study's knockout panel. See presto#13.
  "hitlist>=1.53.0",
]
dev = [
  "pytest>=7.0",
  # Floor matches the version CI pins (see .github/workflows/ci.yml). A much
  # older ruff does not understand `extend-exclude` in ruff.toml and would
  # lint the frozen experiment snapshots.
  "ruff>=0.16.0",
  "mkdocs>=1.5.0",
]

[project.scripts]
presto = "presto.cli.main:main"

[tool.setuptools]
# Enumerated on purpose, and it has to be.
#
# `package-dir = { "presto" = "." }` maps the repo root onto the `presto`
# package, which `[tool.setuptools.packages.find]` cannot express: discovery
# would report `cli`, `data`, ... as top-level packages, and `import presto`
# stops working entirely (verified).
#
# So the list stays, and stays a maintenance risk: it had already drifted,
# missing `presto.scripts.distributional_ba` and its `.heads` subpackage, both
# of which have `__init__.py`. Editable installs hide that via the path hook;
# a wheel or sdist ships without them. `tests/test_packaging.py` now fails
# when the list and the filesystem disagree.
packages = [
  "presto",
  "presto.cli",
  "presto.data",
  "presto.inference",
  "presto.models",
  "presto.training",
  "presto.scripts",
  "presto.scripts.distributional_ba",
  "presto.scripts.distributional_ba.heads",
]
package-dir = { "presto" = "." }

[tool.setuptools.dynamic]
version = {attr = "presto.__version__"}

# Ruff configuration lives in `ruff.toml`, not here.
#
# A `[tool.ruff]` block used to sit at this spot declaring `select = ["E", "F"]`
# with its own per-file-ignores. `ruff.toml` takes precedence over
# `pyproject.toml`, so none of it ever ran -- and editing it looked like it
# worked, because `ruff check` kept reporting clean. Removed rather than
# reconciled: two configs where one is silently dead is worse than a narrow
# config that is honest about its scope.
