name: CI

on:
  push:
  pull_request:

# PR and feature-push updates supersede only their own event/ref group.
# Protected runs use unique IDs: even pending main/tag runs must not be replaced.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
      (github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') &&
       github.ref != 'refs/heads/main' && github.ref) ||
      format('run-{0}', github.run_id)
    }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') &&
         github.ref != 'refs/heads/main') }}

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ruff is pinned: the config now carries no suppressions and a
          # hard 100-column limit, so a new rule promoted into E or F, or a
          # change in how E501 measures width, would red-light an unrelated
          # PR. Bump deliberately.
          python -m pip install 'ruff==0.16.0' pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[hitlist]'
      - name: Lint
        run: ./lint.sh
      - name: Test
        run: ./test.sh
      - name: Build and validate installable distributions
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*.whl dist/*.tar.gz
          python scripts/check_wheel.py dist/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: presto-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mkdocs
        run: |
          python -m pip install --upgrade pip
          python -m pip install mkdocs
      - name: Build docs
        run: mkdocs build --strict
