name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ruff is pinned: the config now carries no suppressions and a
          # hard 100-column limit, so a new rule promoted into E or F, or a
          # change in how E501 measures width, would red-light an unrelated
          # PR. Bump deliberately.
          python -m pip install 'ruff==0.16.0' pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Lint
        run: ./lint.sh
      - name: Test
        run: ./test.sh

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mkdocs
        run: |
          python -m pip install --upgrade pip
          python -m pip install mkdocs
      - name: Build docs
        run: mkdocs build --strict
